spring:
  application:
    name: partygameonline-server-test
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/partygameonline_test}
    username: ${DB_USERNAME:partygameonline}
    password: ${DB_PASSWORD:partygameonline}

games:
  nob:
    timeout-scheduler-enabled: false
  not-in-my-pot:
    timeout-scheduler-enabled: false
  wheres-the-bone:
    timeout-scheduler-enabled: false

app:
  encryption:
    key: test-only-legacy-password-key
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
    token:
      secret: test-only-auth-token-key-that-is-at-least-32-characters
      ttl: 24h
  realtime:
    disconnect-grace: 50ms

logging:
  level:
    com.partygameonline: INFO
    root: WARN
