spring:
  application:
    name: partygameonline-server-dev

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:local-dev-only-legacy-key}
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
    token:
      secret: ${AUTH_TOKEN_KEY:local-dev-auth-token-key-that-is-at-least-32-characters}
      ttl: 24h

logging:
  level:
    com.partygameonline: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
