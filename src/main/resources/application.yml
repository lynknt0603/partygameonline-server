spring:
  application:
    name: partygameonline-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/partygameonline}
    username: ${DB_USERNAME:partygameonline}
    password: ${DB_PASSWORD:partygameonline}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 24h
      tracking-modes: cookie
      cookie:
        name: PGOSESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}

games:
  nob:
    target-score: 10
    timeout-scheduler-enabled: true
    moon-marks:
      value-2-count: 10
      value-3-count: 15
      value-4-count: 10
    timeout:
      draft-seconds: 30
      phase-submit-seconds: 30
      decision-seconds: 30
      reaction-seconds: 10

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:DEV_AES_KEY}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:lax}
  realtime:
    disconnect-grace: ${DISCONNECT_GRACE:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: partygameonline-server
    phase: release

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
